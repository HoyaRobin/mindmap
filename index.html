<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心智圖</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1d2530;--muted:#6b7785;--line:#d8dde4;--node:#fff;--accent:#2f5d8a;--hover:#eaeef3}
@media (prefers-color-scheme:dark){:root{--bg:#13171c;--panel:#1b2027;--text:#e6e9ee;--muted:#97a1ae;--line:#2b323c;--node:#232a33;--accent:#5f93c9;--hover:#252c36}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#side h1{font-size:15px;margin:0;padding:14px 14px 8px}
#list{flex:1;overflow:auto;padding:0 8px}
.mi{display:flex;align-items:center;gap:2px;padding:7px 8px;border-radius:6px;cursor:pointer}
.mi:hover{background:var(--hover)}
.mi.on{background:var(--accent);color:#fff}
.mi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi button{border:0;background:transparent;padding:2px 6px;color:inherit;opacity:.7}
.mi button:hover{opacity:1;background:rgba(127,127,127,.25)}
#foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
#foot p{width:100%;margin:4px 0 0;color:var(--muted);font-size:12px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);border-bottom:1px solid var(--line)}
#tb .sp{flex:1}
#burger{display:none}
#cv{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg text{user-select:none;-webkit-user-select:none;pointer-events:none;font-family:inherit}
.nd.sel>rect:first-of-type{stroke-width:4;filter:drop-shadow(0 0 5px var(--accent))}
.add{opacity:0;transition:opacity .12s;cursor:pointer}
.nd:hover .add,.nd.sel .add{opacity:1}
.add:hover circle,.add:hover rect{fill:var(--hover)}
#thm,#lay{position:fixed;z-index:25;width:230px;max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#thm[hidden],#lay[hidden]{display:none}
#thm .th,#lay .th{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px;border-radius:8px}
#thm .th:hover,#lay .th:hover{background:var(--hover)}
#thm .th.on,#lay .th.on{border-color:var(--accent)}
#thm .dots{display:flex;gap:4px}
#thm .dots i{width:16px;height:16px;border-radius:50%;display:block}
#lay .ic{font-size:18px;line-height:1}
#thm small,#lay small{color:var(--muted)}
#inp{position:absolute;display:none;z-index:5;text-align:center;border:2px solid var(--accent);border-radius:20px;background:var(--panel);color:var(--text);font-family:inherit;outline:none;padding:0 8px}
#hint{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0));color:var(--muted);font-size:12px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
@media (max-width:700px){
#side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s}
body.open #side{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
#burger{display:inline-block}#hint{display:none}}
@media (prefers-reduced-motion:reduce){#side,#toast{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <h1>我的心智圖</h1>
  <div id="list"></div>
  <div id="foot">
    <button id="bNew">新增</button><button id="bExp">匯出備份</button><button id="bImp">匯入</button>
    <p>內容自動儲存在這個瀏覽器。換電腦請用匯出/匯入。</p>
    <p id="ver">版本 2026-10-01 · v8</p>
  </div>
</aside>
<div id="main">
  <div id="tb">
    <button id="burger">☰</button>
    <button data-a="child" title="Tab">新增子節點</button>
    <button data-a="sib" title="Enter">新增同層</button>
    <button data-a="edit" title="F2 或雙擊">編輯文字</button>
    <button data-a="tog" title="Space">收合/展開</button>
    <button data-a="col">換色</button>
    <button data-a="del" title="Delete">刪除</button>
    <span class="sp"></span>
    <button data-a="undo" title="Ctrl+Z">復原</button>
    <button data-a="lay">版面方向</button>
    <button data-a="thm">配色風格</button>
    <button data-a="zo">縮小</button><button data-a="zi">放大</button><button data-a="ctr">置中</button>
  </div>
  <div id="cv">
    <svg id="svg"><g id="g"></g></svg>
    <input id="inp" aria-label="節點文字">
    <div id="hint">滑過節點:側邊＋新增子節點、下方＋新增同層 · 雙擊編輯 · Space 收合 · Delete 刪除 · Ctrl+Z 復原</div>
  </div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<div id="thm" hidden></div>
<div id="lay" hidden></div>
<script>
const KEY='hoyarobin_mindmap_v1';
const PAL=['#e4572e','#e9a23b','#3fa56b','#2f8fd8','#8a63d2','#d9558f'];
const HG=48,VG=48;
const $=id=>document.getElementById(id);
const svg=$('svg'),G=$('g'),L=$('list'),INP=$('inp'),FILE=$('file');
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(text,o)=>Object.assign({id:uid(),text,children:[]},o);
const strip=(k,v)=>k[0]==='_'?undefined:v;
const newMap=name=>{const r=mk('中心主題');['想法一','想法二','想法三'].forEach((t,i)=>r.children.push(mk(t,{side:i%2?'l':'r',color:PAL[i]})));return{id:uid(),name,v:2,root:r}};
let S,hist=[],sel=null,view={x:0,y:0,k:1};

function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S||!Array.isArray(S.maps)||!S.maps.length){const m=newMap('我的第一張心智圖');S={maps:[m],cur:m.id}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,strip))}catch(e){toast('儲存失敗:瀏覽器禁止儲存或空間不足,請先匯出備份')}}
const cur=()=>S.maps.find(m=>m.id===S.cur)||S.maps[0];
const cv=$('cv');
const THEMES={
  default:{n:'預設',d:'清爽簡潔',pal:PAL,decay:.62},
  muji:{n:'無印風',d:'低彩度大地色、方正簡約',pal:['#8c6f56','#a8926f','#7a8470','#9b8a93','#b4a48a','#6d7b77'],decay:.72,rx:4,bg:'#f2eee6',
    v:{'--node':'#fbf8f2','--text':'#3b3832','--muted':'#8a8478','--accent':'#4e473d','--panel':'#fbf8f2','--hover':'#e8e2d6'}},
  vivid:{n:'繽紛風',d:'高彩度、對比鮮明',pal:['#ff2e63','#ff8a00','#ffc800','#00b86b','#1e90ff','#9b4dff'],decay:.66,bg:'#fffaf0',
    v:{'--node':'#ffffff','--text':'#241f31','--muted':'#7a7388','--accent':'#2d2250','--panel':'#ffffff','--hover':'#f1ecfa'}},
  kids:{n:'幼兒色彩風',d:'柔和糖果色、圓潤粗線',pal:['#ff8fab','#ffc233','#6fd08c','#5fbff9','#b59cff','#ff9d66'],decay:.8,ew:4.5,sw:2.5,bg:'#fff8e7',
    v:{'--node':'#ffffff','--text':'#5b4636','--muted':'#a58f7a','--accent':'#f0558a','--panel':'#ffffff','--hover':'#ffeccb'}},
  morandi:{n:'莫蘭迪',d:'灰調、霧面、高級感',pal:['#b08d8b','#a5a58d','#8e9aaf','#c4a484','#9a8c98','#7f9c96'],decay:.78,rx:10,bg:'#e9e6e1',
    v:{'--node':'#f6f4f1','--text':'#4a4642','--muted':'#8c857d','--accent':'#6b6470','--panel':'#f6f4f1','--hover':'#dedad3'}},
  macaron:{n:'Macaron 馬卡龍',d:'Dopamine 粉嫩多巴胺色',pal:['#ff8fb8','#ffa66b','#ffd93d','#5fdcae','#6ab8ff','#b48cff'],decay:.8,ew:3.5,bg:'#fdf5fa',
    v:{'--node':'#ffffff','--text':'#4b3f5c','--muted':'#a597b5','--accent':'#8f5fe0','--panel':'#ffffff','--hover':'#f6e6f3'}},
  cyber:{n:'Cyberpunk 霓虹暗黑',d:'深色底、霓虹發光線條',pal:['#ff2bd6','#00e5ff','#b6ff00','#ffe600','#8c5cff','#ff4d6d'],decay:.7,ew:3,glow:1,bg:'#0d0d1f',
    v:{'--node':'#17172e','--text':'#e6f1ff','--muted':'#7f86b2','--accent':'#7a2cff','--panel':'#17172e','--hover':'#26264d'}}
};
const theme=()=>THEMES[cur().theme]||THEMES.default;
for(const k in THEMES)THEMES[k].sp=sortPal(THEMES[k].pal);
function applyTheme(){const T=theme();
  ['--node','--text','--muted','--accent','--panel','--hover'].forEach(k=>cv.style.removeProperty(k));
  cv.style.background=T.bg||'';
  if(T.v)for(const k in T.v)cv.style.setProperty(k,T.v[k]);}
function normMap(m){norm(m.root);if(!m.v){m.root.children.forEach((c,i)=>{if(c.ci===i%6)delete c.ci});m.v=2}}
function norm(n){if(n.color){const i=PAL.indexOf(n.color);if(i>=0)n.ci=i;delete n.color}n.children.forEach(norm)}
function snap(){hist.push(JSON.stringify(S,strip));if(hist.length>60)hist.shift()}
function mut(fn){snap();fn();save();render()}
function find(id,n,p){n=n||cur().root;if(n.id===id)return{n,p:p||null};for(const c of n.children){const r=find(id,c,n);if(r)return r}return null}
const getSel=()=>(sel&&find(sel))||find(cur().root.id);

/* 版面 */
const cx=document.createElement('canvas').getContext('2d');
const tw=(n,root)=>{cx.font=(root?'600 17px ':'14px ')+'sans-serif';return Math.max(root?90:56,cx.measureText(n.text||' ').width+(root?40:28))};
const VD=44;
const MODES={lr:['r','l'],r:['r'],l:['l'],d:['d'],u:['u'],four:['r','d','l','u']};
const DIRM={r:'R',l:'L',d:'D',u:'U'};
function pickSide(){const m=cur(),sd=MODES[m.layout||'lr'],cnt=k=>m.root.children.filter(c=>(c.side||'r')===k).length;
  return sd.reduce((a,k)=>cnt(k)<cnt(a)?k:a,sd[0])}
function sh(n,d){
  n._w=tw(n,false);n._hh=30;
  const sum=(n.collapsed||!n.children.length)?0:n.children.reduce((s,c)=>s+sh(c,d),0);
  n._sum=sum;n._b=(d==='D'||d==='U')?Math.max(n._w+24,sum):Math.max(VG,sum);return n._b}
function pl(n,edge,start,d){
  const cb=start+n._b/2,w=n._w,h=n._hh;
  if(d==='R'){n._x=edge;n._y=cb}
  else if(d==='L'){n._x=edge-w;n._y=cb}
  else if(d==='D'){n._x=cb-w/2;n._y=edge+h/2}
  else{n._x=cb-w/2;n._y=edge-h/2}
  if(!n.collapsed){let t=start+(n._b-n._sum)/2;
    const ce=d==='R'?n._x+w+HG:d==='L'?n._x-HG:d==='D'?n._y+h/2+VD:n._y-h/2-VD;
    for(const c of n.children){pl(c,ce,t,d);t+=c._b}}}
function layout(){
  const r=cur().root;r._w=tw(r,true);r._hh=40;r._x=-r._w/2;r._y=0;
  const g={r:[],d:[],l:[],u:[]},B={};
  r.children.forEach(c=>g[c.side&&g[c.side]?c.side:'r'].push(c));
  for(const k in g)B[k]=g[k].reduce((s,c)=>s+sh(c,DIRM[k]),0);
  const place=(k,edge)=>{let t=-B[k]/2;for(const c of g[k]){pl(c,edge,t,DIRM[k]);t+=c._b}};
  const HV=Math.max(B.r,B.l)/2,rh=r._hh/2,base=rh+VD;
  place('r',r._x+r._w+HG);place('l',r._x-HG);
  place('d',B.d/2>r._w/2+10?Math.max(base,HV+30):base);
  place('u',-(B.u/2>r._w/2+10?Math.max(base,HV+30):base));
}
function setLayout(k){
  mut(()=>{const m=cur(),sd=MODES[k],ch=m.root.children,N=ch.length;m.layout=k;
    ch.forEach((c,i)=>{c.side=sd[Math.min(sd.length-1,Math.floor(i*sd.length/N))]})});
  center();
}

/* 繪圖 */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),dd=mx-mn,l=(mx+mn)/2;let h=0,s=0;
  if(dd){s=dd/(1-Math.abs(2*l-1));h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=(h*60+360)%360}return[h,s,l]}
function tone(hex,dep,dc){dc=dc||.62;if(dep<=1)return hex;const[h,s,l]=hsl(hex),k=dep-1;
  return `hsl(${Math.round(h)} ${Math.round(Math.max(.14,s*Math.pow(dc,k))*100)}% ${Math.round(Math.min(.7,l+.05*k)*100)}%)`}
function hex2(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const [r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')}
function sortPal(pal){const a=pal.slice().sort((x,y)=>hsl(x)[0]-hsl(y)[0]);let bi=0,bg=999;
  a.forEach((c,i)=>{const g=(hsl(a[(i+1)%a.length])[0]-hsl(c)[0]+360)%360;if(g<bg){bg=g;bi=i}});
  return a.slice(bi+1).concat(a.slice(0,bi+1))}
function hueAt(sp,k,N){const M=sp.length,t=k*M/N,i=Math.floor(t),f=t-i;if(f<1e-6)return sp[i%M];
  const a=hsl(sp[i%M]),b=hsl(sp[(i+1)%M]),dh=(b[0]-a[0]+360)%360;
  return hex2((a[0]+dh*f)%360,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f)}
function inkOn(hex){const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return(.299*v[0]+.587*v[1]+.114*v[2])/255>.6?'#1d2530':'#fff'}
function render(){
  applyTheme();layout();const r=cur().root,T=theme();let e='',nd='';
  const rch=r.children,by=k=>rch.filter(c=>(c.side||'r')===k),ord=[...by('r'),...by('d').reverse(),...by('l').reverse(),...by('u')],rb={};
  ord.forEach((c,k)=>{rb[c.id]=hueAt(T.sp,k,ord.length)});
  const anc=(n,k,d)=>{const x=n._x,y=n._y,w=n._w,h=n._hh,o=k==='out';
    if(d==='R')return o?[x+w,y]:[x,y];
    if(d==='L')return o?[x,y]:[x+w,y];
    if(d==='D')return o?[x+w/2,y+h/2]:[x+w/2,y-h/2];
    return o?[x+w/2,y-h/2]:[x+w/2,y+h/2]};
  const walk=(n,p,base,d,dep)=>{
    const isR=n===r,h=n._hh,col=isR?'var(--accent)':tone(base,dep,T.decay),solid=isR||dep===1,ink=isR?'#fff':(dep===1?inkOn(base):'var(--text)'),v=d==='D'||d==='U';
    if(p){const [x1,y1]=anc(p,'out',d),[x2,y2]=anc(n,'in',d),mx=(x1+x2)/2,my=(y1+y2)/2;
      e+=`<path d="M${x1} ${y1}C${v?`${x1} ${my} ${x2} ${my}`:`${mx} ${y1} ${mx} ${y2}`} ${x2} ${y2}" stroke="${col}" stroke-width="${dep===1?(T.ew||3):(T.ew||3)*.75}" fill="none"/>`}
    const rc=`x="${n._x}" y="${n._y-h/2}" width="${n._w}" height="${h}" rx="${T.rx==null?h/2:T.rx}"`;
    nd+=`<g data-id="${n.id}" class="nd${n.id===sel?' sel':''}" style="cursor:pointer">`+
      `<rect ${rc} fill="${solid?col:'var(--node)'}" stroke="${col}" stroke-width="${T.sw||2}"${T.glow?` style="filter:drop-shadow(0 0 6px ${col})"`:''}/>`+
      (solid?'':`<rect ${rc} fill="${col}" fill-opacity=".13" stroke="none"/>`)+
      `<text x="${n._x+n._w/2}" y="${n._y}" text-anchor="middle" dominant-baseline="central" font-size="${isR?17:14}" font-weight="${isR?600:400}" fill="${ink}">${esc(n.text)}</text>`;
    const off=(dd,k)=>{const [ax,ay]=anc(n,'out',dd);return dd==='R'?[ax+k,ay]:dd==='L'?[ax-k,ay]:dd==='D'?[ax,ay+k]:[ax,ay-k]};
    const plus=(dd,sd)=>{const [ax,ay]=anc(n,'out',dd),[x,y]=off(dd,16),
      hr=dd==='R'?[ax,ay-14,32,28]:dd==='L'?[ax-32,ay-14,32,28]:dd==='D'?[ax-14,ay,28,32]:[ax-14,ay-32,28,32];
      return `<rect x="${hr[0]}" y="${hr[1]}" width="${hr[2]}" height="${hr[3]}" fill="transparent"/><g class="add" data-add="${n.id}" data-side="${sd}"><title>新增子節點</title><circle cx="${x}" cy="${y}" r="10" fill="var(--panel)" stroke="${col}" stroke-width="2"/><path d="M${x-4} ${y}h8M${x} ${y-4}v8" stroke="${col}" stroke-width="2" stroke-linecap="round"/></g>`};
    if(isR){for(const sd of MODES[cur().layout||'lr'])nd+=plus(DIRM[sd],sd)}
    else if(n.collapsed&&n.children.length){const [bx,bY]=off(d,13);
      nd+=`<circle data-tog="${n.id}" cx="${bx}" cy="${bY}" r="10" fill="var(--node)" stroke="${col}" stroke-width="2" style="cursor:pointer"/><text x="${bx}" y="${bY}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--text)">${n.children.length}</text>`}
    else nd+=plus(d,'');
    if(!isR){
      if(v){const sx=n._x+n._w+12;
        nd+=`<rect x="${n._x+n._w}" y="${n._y-h/2}" width="24" height="${h}" fill="transparent"/><g class="add" data-sib="${n.id}"><title>新增同層節點</title><rect x="${sx-6}" y="${n._y-11}" width="12" height="22" rx="6" fill="var(--panel)" stroke="${col}" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M${sx-3} ${n._y}h6M${sx} ${n._y-3}v6" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/></g>`}
      else{const mx=n._x+n._w/2,sy=n._y+h/2;
        nd+=`<rect x="${n._x}" y="${sy}" width="${n._w}" height="18" fill="transparent"/><g class="add" data-sib="${n.id}"><title>新增同層節點</title><rect x="${mx-11}" y="${sy+3}" width="22" height="12" rx="6" fill="var(--panel)" stroke="${col}" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M${mx-3} ${sy+9}h6M${mx} ${sy+6}v6" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/></g>`}}
    nd+='</g>';
    if(!n.collapsed)n.children.forEach(c=>walk(c,n,c.ci!=null?T.sp[c.ci%T.sp.length]:(isR?rb[c.id]:base),isR?(DIRM[c.side||'r']||'R'):d,dep+1));
  };
  walk(r,null,T.sp[0],'R',0);
  G.innerHTML=e+nd;apply();renderList();
}
function apply(){G.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}
function renderList(){L.innerHTML=S.maps.map(m=>`<div class="mi${m.id===S.cur?' on':''}" data-m="${m.id}"><span>${esc(m.name)}</span><button data-ren="${m.id}" title="改名">改名</button><button data-del="${m.id}" title="刪除">刪除</button></div>`).join('')}
function center(){const b=svg.getBoundingClientRect(),k=cur().layout||'lr';view={x:b.width*(k==='r'?.25:k==='l'?.75:.5),y:b.height*(k==='d'?.2:k==='u'?.8:.5),k:1};apply()}
function zoom(f){const b=svg.getBoundingClientRect(),mx=b.width/2,my=b.height/2,k=Math.min(3,Math.max(.25,view.k*f));
  view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply()}
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}

/* 編輯動作 */
function addChild(id,side){
  const f=id?find(id):getSel();if(!f)return;
  mut(()=>{const n=f.n,c=mk('新節點');
    if(!f.p)c.side=side||pickSide();
    n.collapsed=false;n.children.push(c);sel=c.id});
  edit();
}
function addSibling(id){
  const f=id?find(id):getSel();if(!f)return;if(!f.p)return addChild();
  mut(()=>{const c=mk('新節點');
    if(!find(f.p.id).p){c.side=f.n.side}
    f.p.children.splice(f.p.children.indexOf(f.n)+1,0,c);sel=c.id});
  edit();
}
function del(){const f=getSel();if(!f.p){toast('中心主題不能刪除');return}
  mut(()=>{f.p.children.splice(f.p.children.indexOf(f.n),1);sel=f.p.id})}
function toggle(){const f=getSel();if(!f.n.children.length)return;mut(()=>{f.n.collapsed=!f.n.collapsed;sel=f.n.id})}
function color(){const f=getSel();if(!f.p){toast('中心主題不能換色');return}
  mut(()=>{const len=theme().sp.length;let c=(f.n.ci!=null?f.n.ci:-1)+1;if(c>=len){delete f.n.ci;toast('已恢復自動配色')}else f.n.ci=c;sel=f.n.id})}
function undo(){if(!hist.length)return toast('沒有可復原的動作');S=JSON.parse(hist.pop());save();render()}
function edit(){
  const f=getSel(),n=f.n,k=view.k,w=Math.max(n._w,110)*k;
  sel=n.id;
  INP.style.cssText=`display:block;left:${view.x+(n._x+n._w/2)*k-w/2}px;top:${view.y+(n._y-16)*k}px;width:${w}px;height:${32*k}px;font-size:${14*k}px`;
  INP.value=n.text;INP.dataset.id=n.id;INP.focus();INP.select();
}
function endEdit(ok){
  if(INP.style.display!=='block')return;
  const id=INP.dataset.id,v=INP.value.trim();INP.style.display='none';
  if(ok&&v){const f=find(id);if(f&&f.n.text!==v)mut(()=>{f.n.text=v})}
}
INP.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();endEdit(true)}
  else if(e.key==='Escape'){endEdit(false)}
  else if(e.key==='Tab'){e.preventDefault();endEdit(true);addChild()}
});
INP.addEventListener('blur',()=>endEdit(true));

/* 滑鼠 / 觸控 */
let pan=null,last={id:null,t:0};
svg.addEventListener('pointerdown',e=>{
  endEdit(true);
  const ad=e.target.closest('[data-add]'),tg=e.target.closest('[data-tog]');
  const sb=e.target.closest('[data-sib]');
  if(sb){const id=sb.dataset.sib;
    if(e.pointerType==='touch'&&sel!==id){sel=id;render();return}
    addSibling(id);return}
  if(ad){const id=ad.dataset.add;
    if(e.pointerType==='touch'&&sel!==id){sel=id;render();return}
    addChild(id,ad.dataset.side);return}
  if(tg){const f=find(tg.dataset.tog);if(f)mut(()=>{f.n.collapsed=false;sel=f.n.id});return}
  const g=e.target.closest('[data-id]');
  if(g){const id=g.dataset.id,now=Date.now();
    if(last.id===id&&now-last.t<400){sel=id;render();edit();last={id:null,t:0};return}
    last={id,t:now};sel=id;render();return}
  pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!pan)return;const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;
  if(Math.abs(dx)+Math.abs(dy)>4)pan.moved=true;
  view.x=pan.vx+dx;view.y=pan.vy+dy;apply();
});
svg.addEventListener('pointerup',()=>{if(pan&&!pan.moved){sel=null;render()}pan=null});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=svg.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
  const k=Math.min(3,Math.max(.25,view.k*Math.exp(-e.deltaY*.0015)));
  view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply();
},{passive:false});

/* 鍵盤 */
document.addEventListener('keydown',e=>{
  if(/INPUT|BUTTON/.test(e.target.tagName))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Tab'){e.preventDefault();addChild()}
  else if(e.key==='Enter'){e.preventDefault();addSibling()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}
  else if(e.key==='F2'){e.preventDefault();edit()}
  else if(e.key===' '){e.preventDefault();toggle()}
});

/* 工具列 */
const ACT={child:addChild,sib:addSibling,edit,tog:toggle,col:color,del,undo,zi:()=>zoom(1.2),zo:()=>zoom(1/1.2),ctr:center};
$('tb').addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')e.preventDefault()});
$('tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='burger'){document.body.classList.toggle('open');return}
  if(b.dataset.a==='thm'){toggleThm(b);return}
  if(b.dataset.a==='lay'){toggleLay(b);return}
  ACT[b.dataset.a]&&ACT[b.dataset.a]()});

/* 配色 */
const THM=$('thm');
function toggleThm(b){
  if(!THM.hidden){THM.hidden=true;return}
  LAY.hidden=true;const now=cur().theme||'default';
  THM.innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="th${k===now?' on':''}" data-th="${k}"><span class="dots">${t.sp.map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>${t.n}</b><small>${t.d}</small></button>`).join('');
  THM.hidden=false;
  const r=b.getBoundingClientRect();
  THM.style.left=Math.max(8,Math.min(r.left,innerWidth-THM.offsetWidth-8))+'px';
  THM.style.top=(r.bottom+6)+'px';
}
THM.addEventListener('click',e=>{
  const t=e.target.closest('[data-th]');if(!t)return;
  mut(()=>{cur().theme=t.dataset.th});THM.hidden=true;toast('已套用「'+THEMES[t.dataset.th].n+'」');
});
document.addEventListener('pointerdown',e=>{if(!THM.hidden&&!e.target.closest('#thm')&&!e.target.closest('[data-a="thm"]'))THM.hidden=true});

/* 版面方向 */
const LAY=$('lay');
const LAYS=[['lr','⇆','左右雙向','經典心智圖'],['r','→','向右','由左往右展開'],['l','←','向左','由右往左展開'],['d','↓','向下','組織圖樣式'],['u','↑','向上','由下往上展開'],['four','✥','四向展開','上下左右同時展開']];
function toggleLay(b){
  if(!LAY.hidden){LAY.hidden=true;return}
  THM.hidden=true;const now=cur().layout||'lr';
  LAY.innerHTML=LAYS.map(([k,ic,n,d])=>`<button class="th${k===now?' on':''}" data-lay="${k}"><span class="ic">${ic}</span><b>${n}</b><small>${d}</small></button>`).join('');
  LAY.hidden=false;
  const r=b.getBoundingClientRect();
  LAY.style.left=Math.max(8,Math.min(r.left,innerWidth-LAY.offsetWidth-8))+'px';
  LAY.style.top=(r.bottom+6)+'px';
}
LAY.addEventListener('click',e=>{
  const t=e.target.closest('[data-lay]');if(!t)return;
  setLayout(t.dataset.lay);LAY.hidden=true;toast('已切換為「'+LAYS.find(x=>x[0]===t.dataset.lay)[2]+'」');
});
document.addEventListener('pointerdown',e=>{if(!LAY.hidden&&!e.target.closest('#lay')&&!e.target.closest('[data-a="lay"]'))LAY.hidden=true});

/* 多張心智圖 */
$('bNew').onclick=()=>{
  const name=prompt('新心智圖的名稱','新心智圖');if(!name||!name.trim())return;
  const m=newMap(name.trim());S.maps.push(m);S.cur=m.id;sel=null;hist=[];save();center();render();
  document.body.classList.remove('open');
};
L.addEventListener('click',e=>{
  const d=e.target.closest('[data-del]'),rn=e.target.closest('[data-ren]'),it=e.target.closest('[data-m]');
  if(d){
    const m=S.maps.find(x=>x.id===d.dataset.del);
    if(!confirm('刪除「'+m.name+'」?刪除後無法復原。'))return;
    S.maps=S.maps.filter(x=>x!==m);
    if(!S.maps.length)S.maps.push(newMap('新心智圖'));
    if(S.cur===m.id)S.cur=S.maps[0].id;
    sel=null;hist=[];save();center();render();return}
  if(rn){
    const m=S.maps.find(x=>x.id===rn.dataset.ren),v=prompt('新名稱',m.name);
    if(v&&v.trim()){m.name=v.trim();save();renderList()}return}
  if(it){S.cur=it.dataset.m;sel=null;hist=[];save();center();render();document.body.classList.remove('open')}
});

/* 匯出 / 匯入 */
$('bExp').onclick=()=>{
  const b=new Blob([JSON.stringify({v:1,maps:S.maps},strip,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='mindmap-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出備份檔');
};
$('bImp').onclick=()=>FILE.click();
FILE.onchange=async()=>{
  const f=FILE.files[0];FILE.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text()),arr=d.maps||(d.root?[d]:null);
    if(!arr)throw 0;
    const ok=arr.filter(m=>m&&m.root&&Array.isArray(m.root.children));
    if(!ok.length)throw 0;
    snap();
    ok.forEach(m=>{normMap(m);m.id=uid();m.name=(m.name||'匯入')+'(匯入)';S.maps.push(m)});
    S.cur=S.maps[S.maps.length-1].id;sel=null;save();center();render();toast('已匯入 '+ok.length+' 張心智圖');
  }catch(err){toast('檔案格式不正確')}
};

load();S.maps.forEach(normMap);center();render();
</script>
</body>
